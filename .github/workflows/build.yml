name: Build ESP32-S3 Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Prepare Gemini API key header
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          printf '#pragma once\n#define GEMINI_API_KEY "%s"\n' "$GEMINI_API_KEY" > components/websocket/include/gemini_api_key.h

      - name: Build
        run: pio run

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RepoNol-ESP32S3
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
