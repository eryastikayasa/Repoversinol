name: Build ESP32-S3 Voice Reference

on:
  push:
    branches:
      - main
      - reference-mic-gemini
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build ESP32-S3 Voice Reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: PlatformIO version
        run: pio --version

      - name: Prepare Gemini API key header
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          printf '#pragma once\n#define GEMINI_API_KEY "%s"\n' "$GEMINI_API_KEY" > components/websocket/include/gemini_api_key.h

      - name: Clean build
        run: pio run -t clean

      - name: Build ESP32-S3
        run: pio run

      - name: Audit firmware outputs
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -s "$BUILD/firmware.bin"
          test -s "$BUILD/bootloader.bin"
          test -s "$BUILD/partitions.bin"
          test -s "$BUILD/firmware.elf"
          echo "Firmware: PASS"
          echo "ELF: PASS"

      - name: Audit CA bundle
        run: |
          set -euo pipefail
          ELF=.pio/build/esp32-s3-devkitc-1/firmware.elf
          readelf -Ws "$ELF" | grep -E '_binary_x509_crt_bundle_(start|end)'
          echo "CA bundle: PASS"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-Voice-Reference
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
