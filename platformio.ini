[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions/partitions.csv
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Optional transport-only experiment. Keep disabled for the real MIC path.
; Uncomment to build TEST A (synthetic PCM -> Gemini TX).
; build_flags = -DVOICE_REFERENCE_SYNTHETIC_TX=1

; Keep ESP-IDF x509 certificate bundle in the final ELF.
build_flags =
    -Wl,--undefined=_binary_x509_crt_bundle_start
    -Wl,--undefined=_binary_x509_crt_bundle_end
